name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install

      - run: pnpm test

      - run: pnpm package

      - uses: actions/upload-artifact@v4
        with:
          name: pi-vscode
          path: "*.vsix"

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pi-vscode

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath *.vsix

      - name: Publish to Open VSX
        if: env.OVSX_TOKEN != ''
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: npx ovsx publish *.vsix -p "$OVSX_TOKEN"

      - name: Report skipped registries
        if: env.VSCE_PAT == '' || env.OVSX_TOKEN == ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          [ -n "$VSCE_PAT" ] || echo "VSCE_PAT is not configured; Marketplace upload skipped."
          [ -n "$OVSX_TOKEN" ] || echo "OVSX_TOKEN is not configured; Open VSX upload skipped."

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pi-vscode

      - name: Create GitHub release with VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" *.vsix --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
